name: Update profile assets

# Regenerates the local SVG cards from live GitHub/npm data once a day.
# Commits only when the generated output actually differs (no empty commits).

on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate assets
        run: node scripts/generate_profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate assets
        run: node scripts/validate_svg.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore(profile): refresh generated assets [skip ci]"
            git push
          else
            echo "No changes in assets/ — skipping commit."
          fi
